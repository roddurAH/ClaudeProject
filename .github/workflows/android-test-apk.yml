name: Android test APK

# Builds an APK to install on your own Android phone for testing (not for
# Google Play): signed with a throw-away debug key, and it may talk to a laptop
# on the same Wi-Fi over plain http. The APK is published as the
# "android-test" pre-release (open it on the phone to download) and is also
# kept as a run artifact for 14 days.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server address built into the app (optional), e.g. http://192.168.0.10:8000/api/v1'
        required: false
        default: ''

permissions:
  contents: write   # to update the "android-test" pre-release

concurrency:
  group: android-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Limit Gradle memory to what the runner has
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        env:
          KRISHI_ALLOW_HTTP: 'true'
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk krishi-sathi-test.apk
          ls -l krishi-sathi-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: krishi-sathi-test-apk
          path: mobile/krishi-sathi-test.apk
          retention-days: 14

      - name: Publish as the "android-test" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test krishi-sathi-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Krishi Sathi – test APK (not for Google Play)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Open this page on your Android phone, download krishi-sathi-test.apk and install it (allow 'Install unknown apps' for your browser). If an older test APK is installed, uninstall it first. See docs/ANDROID_RELEASE.md → 'Test APK'."
